<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector de Códigos de Barras</title>
  <!-- Librería html5-qrcode para escanear con la cámara -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --duplicate: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-status {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .row-btn {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary { background-color: var(--primary); color: white; flex: 1; }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-success { background-color: var(--success); color: white; width: 100%; padding: 12px; font-size: 1rem; }
    .btn-success:hover { background-color: #059669; }

    .btn-warning-action { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
    
    .btn-danger { background-color: #fee2e2; color: var(--danger); }
    .btn-danger-outline { background: #fff; color: var(--danger); border: 1px solid #fca5a5; }

    /* Contenedor de la cámara y Overlay */
    .scanner-wrapper {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 2px dashed var(--border);
      background: #000;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader { width: 100%; }

    /* Overlays de estado */
    .status-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      z-index: 10;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Estado Listo */
    .overlay-ready {
      background: rgba(16, 185, 129, 0.95);
      color: white;
    }

    /* Estado Duplicado */
    .overlay-duplicate {
      background: rgba(220, 38, 38, 0.95);
      color: white;
    }

    .status-overlay .icon { font-size: 2.8rem; margin-bottom: 4px; }
    .status-overlay .title { font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; }
    
    .status-overlay .code-box {
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    .dup-details-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      text-align: left;
      width: 100%;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .dup-details-card span { font-weight: 700; color: #fef08a; }

    /* Lista de lecturas */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .items-container {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      font-size: 0.86rem;
    }

    .item-card.is-dup {
      border-left-color: var(--duplicate);
      background: #fff5f5;
    }

    .item-code {
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
    }

    .item-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-status {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-synced { background: #dcfce7; color: #15803d; }
    .status-dup-badge { background: #fee2e2; color: #991b1b; }
    .status-pending { background: #fef3c7; color: #b45309; }

    .collapsible { display: none; margin-top: 10px; }
    .collapsible.open { display: block; }
  </style>
</head>
<body>

<div class="container">

  <!-- Encabezado y configuración -->
  <div class="card">
    <h1>
      <span>📦 Lector de Códigos</span>
      <span class="badge-status" id="projectBadge">General</span>
    </h1>

    <div style="margin-top: 8px; display: flex; justify-content: space-between;">
      <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="toggleConfig()">
        ⚙️ Configurar URL Script
      </button>
      <button class="btn-danger-outline" style="padding: 4px 8px; font-size: 0.75rem;" onclick="clearCurrentProjectHistory()">
        🗑️ Borrar Historial
      </button>
    </div>

    <div id="configSection" class="collapsible">
      <div class="form-group" style="margin-top: 10px;">
        <label>URL Web App (Google Apps Script)</label>
        <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="btn-primary" style="margin-top: 6px;" onclick="saveScriptUrl()">Guardar URL</button>
      </div>
    </div>
  </div>

  <!-- Gestión de Proyectos -->
  <div class="card">
    <div class="form-group">
      <label>Proyecto / Pestaña Google Sheets</label>
      <div class="row-btn">
        <input type="text" id="projectNameInput" placeholder="Ej: Inventario_Bodega_A">
        <button class="btn-primary" onclick="setProject()">Fijar Proyecto</button>
      </div>
    </div>
  </div>

  <!-- Escáner de Cámara -->
  <div class="card">
    <div class="scanner-wrapper">
      <div id="reader"></div>

      <!-- Overlay Estado LISTO -->
      <div id="readyOverlay" class="status-overlay overlay-ready" style="display: none;">
        <div class="icon">✅</div>
        <div class="title">¡Listo!</div>
        <div class="code-box" id="overlayReadyCode">---</div>
        <button class="btn-success" onclick="resumeScanning()">
          ➡️ Siguiente código
        </button>
      </div>

      <!-- Overlay Estado DUPLICADO -->
      <div id="duplicateOverlay" class="status-overlay overlay-duplicate" style="display: none;">
        <div class="icon">⚠️</div>
        <div class="title">¡Código Duplicado!</div>
        <div class="code-box" id="overlayDupCode">---</div>
        
        <div class="dup-details-card">
          <div>📁 <b>Hoja:</b> <span id="dupSheet">---</span></div>
          <div>📍 <b>Celda:</b> <span id="dupCell">---</span></div>
          <div>🕒 <b>Fecha:</b> <span id="dupDate">---</span></div>
        </div>

        <button class="btn-warning-action" style="width: 100%; padding: 12px; font-weight: 700;" onclick="resumeScanning()">
          ➡️ Continuar / Siguiente
        </button>
      </div>
    </div>
    
    <div class="row-btn" style="margin-top: 10px;">
      <button id="btnStartScan" class="btn-primary" onclick="startScanner()">📷 Iniciar Cámara</button>
      <button id="btnStopScan" class="btn-danger" style="display:none;" onclick="stopScanner()">⏹ Detener</button>
    </div>

    <!-- Entrada manual alternativa -->
    <div class="form-group" style="margin-top: 10px;">
      <div class="row-btn">
        <input type="text" id="manualBarcodeInput" placeholder="Ingreso manual de código...">
        <button class="btn-secondary" onclick="handleManualSubmit()">Agregar</button>
      </div>
    </div>
  </div>

  <!-- Lista de Códigos Escaneados en Memoria -->
  <div class="card">
    <div class="list-header">
      <label>Historial en este proyecto (<span id="scanCount">0</span>)</label>
    </div>
    
    <div class="items-container" id="itemsList">
      <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px;">
        No hay lecturas registradas en este proyecto.
      </div>
    </div>
  </div>

</div>

<!-- Audios -->
<audio id="beepSuccess" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
<audio id="beepAlert" src="https://assets.mixkit.co/active_storage/sfx/2873/2873-preview.mp3" preload="auto"></audio>

<script>
  let html5QrCode = null;
  let isScanning = false;
  let isPausedState = false;

  // Estado
  let currentProject = localStorage.getItem("scanner_current_project") || "General";
  let scriptUrl = localStorage.getItem("scanner_script_url") || "";
  let projectHistory = []; // Lista de items del proyecto actual

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("projectNameInput").value = currentProject;
    document.getElementById("projectBadge").textContent = currentProject;
    document.getElementById("scriptUrlInput").value = scriptUrl;

    loadProjectMemory();
    renderList();
  });

  function toggleConfig() {
    document.getElementById("configSection").classList.toggle("open");
  }

  function saveScriptUrl() {
    const val = document.getElementById("scriptUrlInput").value.trim();
    scriptUrl = val;
    localStorage.setItem("scanner_script_url", scriptUrl);
    alert("URL de Google Apps Script guardada.");
    toggleConfig();
  }

  function setProject() {
    const inputVal = document.getElementById("projectNameInput").value.trim();
    if (!inputVal) {
      alert("Escribe un nombre para el proyecto.");
      return;
    }
    currentProject = inputVal;
    localStorage.setItem("scanner_current_project", currentProject);
    document.getElementById("projectBadge").textContent = currentProject;
    
    loadProjectMemory();
    renderList();
  }

  // Memoria por proyecto en localStorage
  function loadProjectMemory() {
    const raw = localStorage.getItem(`history_${currentProject}`);
    if (raw) {
      try {
        projectHistory = JSON.parse(raw);
      } catch (e) {
        projectHistory = [];
      }
    } else {
      projectHistory = [];
    }
  }

  function saveProjectMemory() {
    localStorage.setItem(`history_${currentProject}`, JSON.stringify(projectHistory));
  }

  function clearCurrentProjectHistory() {
    if (confirm(`¿Seguro que deseas borrar el historial local del proyecto "${currentProject}"? (Los datos en Google Sheets no se borrarán)`)) {
      projectHistory = [];
      localStorage.removeItem(`history_${currentProject}`);
      renderList();
    }
  }

  // Escáner
  function startScanner() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = {
      fps: 10,
      qrbox: { width: 260, height: 160 },
      aspectRatio: 1.777778
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      () => {}
    ).then(() => {
      isScanning = true;
      isPausedState = false;
      document.getElementById("btnStartScan").style.display = "none";
      document.getElementById("btnStopScan").style.display = "inline-flex";
    }).catch(err => {
      console.error("Error cámara:", err);
      alert("No se pudo iniciar la cámara. Verifica los permisos.");
    });
  }

  function stopScanner() {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        isScanning = false;
        isPausedState = false;
        hideOverlays();
        document.getElementById("btnStartScan").style.display = "inline-flex";
        document.getElementById("btnStopScan").style.display = "none";
      }).catch(err => console.error("Error al detener:", err));
    }
  }

  function onScanSuccess(decodedText) {
    if (isPausedState) return;
    isPausedState = true;

    if (html5QrCode) {
      try { html5QrCode.pause(true); } catch (e) {}
    }

    processBarcode(decodedText);
  }

  function handleManualSubmit() {
    const input = document.getElementById("manualBarcodeInput");
    const val = input.value.trim();
    if (!val) return;

    if (html5QrCode && isScanning) {
      try { html5QrCode.pause(true); } catch (e) {}
    }
    isPausedState = true;

    processBarcode(val);
    input.value = "";
  }

  function processBarcode(barcode) {
    const timestamp = formatDateTime(new Date());

    // 1. Revisar primero en la memoria local si ya está en este u otros proyectos
    let localDup = findInLocalHistory(barcode);

    // 2. Crear registro inicial
    const newItem = {
      id: Date.now(),
      barcode: barcode,
      timestamp: timestamp,
      status: "pending",
      isDuplicate: !!localDup,
      dupInfo: localDup ? { sheetName: localDup.project + " (Local)", cell: "Memoria", date: localDup.timestamp } : null
    };

    projectHistory.unshift(newItem);
    saveProjectMemory();
    renderList();

    // 3. Enviar a Google Sheets para validación en toda la hoja de cálculo
    sendAndValidateSheets(newItem);
  }

  function findInLocalHistory(barcode) {
    // Buscar en el proyecto actual
    const foundCurrent = projectHistory.find(i => i.barcode === barcode);
    if (foundCurrent) {
      return { project: currentProject, timestamp: foundCurrent.timestamp };
    }
    // Buscar en otros proyectos guardados en localStorage
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith("history_") && key !== `history_${currentProject}`) {
        try {
          const list = JSON.parse(localStorage.getItem(key));
          const match = list.find(item => item.barcode === barcode);
          if (match) {
            return { project: key.replace("history_", ""), timestamp: match.timestamp };
          }
        } catch(e){}
      }
    }
    return null;
  }

  function sendAndValidateSheets(item) {
    if (!scriptUrl) {
      // Sin URL configurada: mostrar resultado según memoria local
      handleValidationResult(item, item.isDuplicate, item.dupInfo);
      return;
    }

    const payload = {
      project: currentProject,
      barcode: item.barcode,
      timestamp: item.timestamp
    };

    // Petición POST a Google Apps Script
    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // Evita preflight CORS
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "duplicate" && data.duplicateInfo) {
        item.status = "duplicate";
        item.isDuplicate = true;
        item.dupInfo = data.duplicateInfo;
        saveProjectMemory();
        renderList();
        showDuplicateAlert(item.barcode, data.duplicateInfo);
      } else {
        item.status = "synced";
        item.isDuplicate = false;
        saveProjectMemory();
        renderList();
        showReadyAlert(item.barcode);
      }
    })
    .catch(err => {
      // Si falla la red o modo CORS, usamos la validación local como fallback
      console.warn("Respuesta sin JSON o fallo de red. Aplicando validación local.", err);
      item.status = "synced";
      saveProjectMemory();
      renderList();
      handleValidationResult(item, item.isDuplicate, item.dupInfo);
    });
  }

  function handleValidationResult(item, isDup, dupInfo) {
    if (isDup && dupInfo) {
      showDuplicateAlert(item.barcode, dupInfo);
    } else {
      showReadyAlert(item.barcode);
    }
  }

  function showReadyAlert(barcode) {
    playAudio("beepSuccess");
    if (navigator.vibrate) navigator.vibrate(100);

    document.getElementById("overlayReadyCode").textContent = barcode;
    document.getElementById("readyOverlay").style.display = "flex";
    document.getElementById("duplicateOverlay").style.display = "none";
  }

  function showDuplicateAlert(barcode, info) {
    playAudio("beepAlert");
    if (navigator.vibrate) navigator.vibrate([150, 100, 150]);

    document.getElementById("overlayDupCode").textContent = barcode;
    document.getElementById("dupSheet").textContent = info.sheetName || currentProject;
    document.getElementById("dupCell").textContent = info.cell || "---";
    document.getElementById("dupDate").textContent = info.date || "---";

    document.getElementById("duplicateOverlay").style.display = "flex";
    document.getElementById("readyOverlay").style.display = "none";
  }

  function resumeScanning() {
    hideOverlays();
    isPausedState = false;

    if (html5QrCode && isScanning) {
      try { html5QrCode.resume(); } catch (e) {}
    }
  }

  function hideOverlays() {
    document.getElementById("readyOverlay").style.display = "none";
    document.getElementById("duplicateOverlay").style.display = "none";
  }

  function playAudio(id) {
    const snd = document.getElementById(id);
    if (snd) {
      snd.currentTime = 0;
      snd.play().catch(() => {});
    }
  }

  function formatDateTime(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  function renderList() {
    const listContainer = document.getElementById("itemsList");
    const countBadge = document.getElementById("scanCount");
    
    countBadge.textContent = projectHistory.length;

    if (projectHistory.length === 0) {
      listContainer.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px;">
          No hay lecturas registradas en este proyecto.
        </div>
      `;
      return;
    }

    listContainer.innerHTML = projectHistory.map(item => {
      let statusClass = "status-synced";
      let statusText = "Sincronizado";

      if (item.isDuplicate) {
        statusClass = "status-dup-badge";
        statusText = `⚠️ Duplicado (${item.dupInfo ? item.dupInfo.sheetName : 'Detectado'})`;
      } else if (item.status === "pending") {
        statusClass = "status-pending";
        statusText = "Enviando...";
      }

      return `
        <div class="item-card ${item.isDuplicate ? 'is-dup' : ''}">
          <div>
            <div class="item-code">${escapeHtml(item.barcode)}</div>
            <div class="item-meta">${item.timestamp}</div>
          </div>
          <span class="item-status ${statusClass}">${statusText}</span>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(string) {
    return String(string).replace(/[&<>"']/g, function (m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }
</script>

</body>
</html>
