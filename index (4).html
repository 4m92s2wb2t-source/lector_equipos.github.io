<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Levantamiento Técnico</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --locked-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 { font-size: 1.15rem; font-weight: 800; color: #1e293b; }
    h2 { font-size: 0.95rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      justify-content: space-between;
    }

    .req { color: var(--danger); font-weight: 800; }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus { border-color: var(--primary); }

    input:read-only {
      background-color: var(--locked-bg);
      color: #334155;
      font-weight: 600;
      border-style: dashed;
    }

    button {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-unlock { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; font-size: 0.75rem; padding: 4px 8px; }
    .btn-scan { background: #0284c7; color: white; padding: 9px 12px; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    
    .btn-submit {
      background: var(--success);
      color: white;
      font-size: 1.05rem;
      padding: 14px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .scanner-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }

    .collapsible { display: none; margin-top: 8px; }
    .collapsible.open { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section-divider {
      border-top: 1px solid var(--border);
      margin: 10px 0 12px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Configuración -->
  <div class="card">
    <div class="card-header">
      <h1>📋 Levantamiento Técnico</h1>
      <span class="badge" id="projectBadge">General</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button class="btn-secondary" style="font-size: 0.72rem; padding: 4px 8px;" onclick="toggleConfig()">
        ⚙️ Configurar URL
      </button>
      <button class="btn-secondary" style="font-size: 0.72rem; padding: 4px 8px;" onclick="fetchCatOptions(true)">
        🔄 Actualizar Catálogos
      </button>
    </div>

    <div id="configSection" class="collapsible">
      <div class="form-group" style="margin-top: 8px;">
        <label>URL Web App Google Apps Script</label>
        <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="btn-primary" style="margin-top: 6px;" onclick="saveScriptUrl()">Guardar URL</button>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="form-group">
      <label>Proyecto / Pestaña Activa</label>
      <div class="input-row">
        <input type="text" id="projectNameInput" placeholder="Ej: Piso_4_Oficinas">
        <button class="btn-primary" onclick="changeProject()">Fijar</button>
      </div>
    </div>
  </div>

  <!-- Formulario -->
  <form id="inventoryForm" onsubmit="handleFormSubmit(event)">

    <!-- Datos Fijos -->
    <div class="card">
      <div class="card-header">
        <h2>📍 Ubicación y Personal</h2>
      </div>

      <div class="form-group">
        <label>Técnico <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="tecnicoInput" list="tecnicosList" required placeholder="Nombre del Técnico" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockTecnico" onclick="toggleFieldLock('tecnicoInput', 'btnUnlockTecnico')">✏️ Modificar</button>
        </div>
      </div>

      <div class="form-group">
        <label>Unidad Administrativa <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="unidadInput" list="unidadesList" required placeholder="Área / Dirección" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockUnidad" onclick="toggleFieldLock('unidadInput', 'btnUnlockUnidad')">✏️ Modificar</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Inmueble <span class="req">*</span></label>
          <div class="input-row">
            <input type="text" id="inmuebleInput" list="inmueblesList" required placeholder="Edificio / Sede" readonly>
            <button type="button" class="btn-unlock" id="btnUnlockInmueble" onclick="toggleFieldLock('inmuebleInput', 'btnUnlockInmueble')">✏️</button>
          </div>
        </div>

        <div class="form-group">
          <label>Piso <span class="req">*</span></label>
          <div class="input-row">
            <input type="text" id="pisoInput" list="pisosList" required placeholder="Ej: Piso 3" readonly>
            <button type="button" class="btn-unlock" id="btnUnlockPiso" onclick="toggleFieldLock('pisoInput', 'btnUnlockPiso')">✏️</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Usuario Asignado <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="usuarioInput" required placeholder="Nombre completo" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockUsuario" onclick="toggleFieldLock('usuarioInput', 'btnUnlockUsuario')">✏️ Modificar</button>
        </div>
      </div>

      <div class="form-group">
        <label>Fecha del Servicio</label>
        <input type="text" id="fechaServicioInput" readonly>
      </div>
    </div>

    <!-- CPU -->
    <div class="card">
      <h2>🖥️ CPU / Computadora</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca CPU</label>
          <input type="text" id="marcaCpuInput" list="marcasCpuList" placeholder="Dell">
        </div>
        <div class="form-group">
          <label>Modelo CPU</label>
          <input type="text" id="modeloCpuInput" list="modelosCpuList" placeholder="OptiPlex 7080">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie CPU <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieCpuInput" required placeholder="Serie...">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieCpuInput', 'CPU')">📷 Escanear</button>
        </div>
      </div>
    </div>

    <!-- Monitor -->
    <div class="card">
      <h2>🖥️ Monitor</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca Monitor</label>
          <input type="text" id="marcaMonitorInput" list="marcasMonList" placeholder="HP">
        </div>
        <div class="form-group">
          <label>Modelo Monitor</label>
          <input type="text" id="modeloMonitorInput" list="modelosMonList" placeholder="P24v G4">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie Monitor <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieMonitorInput" required placeholder="Serie...">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieMonitorInput', 'Monitor')">📷 Escanear</button>
        </div>
      </div>
    </div>

    <!-- No Break / UPS -->
    <div class="card">
      <h2>🔋 No Break / UPS</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca No Break</label>
          <input type="text" id="marcaUpsInput" list="marcasUpsList" placeholder="APC">
        </div>
        <div class="form-group">
          <label>Modelo No Break</label>
          <input type="text" id="modeloUpsInput" list="modelosUpsList" placeholder="Back-UPS 600">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie No Break <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieUpsInput" required placeholder="Serie...">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieUpsInput', 'UPS')">📷 Escanear</button>
        </div>
      </div>
    </div>

    <!-- Estatus y Envío -->
    <div class="card">
      <div class="form-group">
        <label>Estatus del Servicio</label>
        <select id="estatusInput">
          <option value="En Proceso">En Proceso</option>
          <option value="Cerrado">Cerrado</option>
          <option value="Pendiente">Pendiente</option>
        </select>
      </div>

      <button type="submit" id="btnSubmitForm" class="btn-submit">
        💾 Guardar Levantamiento en Sheets
      </button>
    </div>

  </form>

</div>

<!-- Modal Escáner -->
<div id="scannerModal" class="scanner-modal" style="display: none;">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="scannerModalTitle" style="font-size: 1rem; color: #1e293b;">Escaneando...</h3>
      <button type="button" class="btn-danger" style="padding: 4px 8px;" onclick="closeScanner()">✖ Cerrar</button>
    </div>
    <div id="reader"></div>
  </div>
</div>

<!-- Datalists -->
<datalist id="tecnicosList"></datalist>
<datalist id="unidadesList"></datalist>
<datalist id="inmueblesList"></datalist>
<datalist id="pisosList"></datalist>
<datalist id="marcasCpuList"></datalist>
<datalist id="modelosCpuList"></datalist>
<datalist id="marcasMonList"></datalist>
<datalist id="modelosMonList"></datalist>
<datalist id="marcasUpsList"></datalist>
<datalist id="modelosUpsList"></datalist>

<script>
  let html5QrCode = null;
  let activeScanTarget = null;
  let activeScanType = "";

  // Audio sintético nativo (0 KB de red)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beepSuccess() {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch(e){}
  }

  let currentProject = localStorage.getItem("inv_current_project") || "General";
  let scriptUrl = localStorage.getItem("scanner_script_url") || "";

  const fixedFields = ["tecnicoInput", "unidadInput", "inmuebleInput", "pisoInput", "usuarioInput"];

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("projectNameInput").value = currentProject;
    document.getElementById("projectBadge").textContent = currentProject;
    document.getElementById("scriptUrlInput").value = scriptUrl;

    updateDateTime();
    loadFixedFieldValues();
    loadLocalCatalogCache();
  });

  function updateDateTime() {
    const pad = n => String(n).padStart(2, '0');
    const d = new Date();
    document.getElementById("fechaServicioInput").value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function toggleConfig() {
    document.getElementById("configSection").classList.toggle("open");
  }

  function saveScriptUrl() {
    scriptUrl = document.getElementById("scriptUrlInput").value.trim();
    localStorage.setItem("scanner_script_url", scriptUrl);
    alert("URL guardada.");
    toggleConfig();
    fetchCatOptions(true);
  }

  function changeProject() {
    const val = document.getElementById("projectNameInput").value.trim();
    if (!val) return;
    currentProject = val;
    localStorage.setItem("inv_current_project", currentProject);
    document.getElementById("projectBadge").textContent = currentProject;
    loadLocalCatalogCache();
    alert(`Proyecto activo cambiado a: ${currentProject}`);
  }

  function toggleFieldLock(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);

    if (input.hasAttribute("readonly")) {
      input.removeAttribute("readonly");
      input.focus();
      btn.textContent = "🔒 Fijar";
      btn.style.background = "#dcfce7";
      btn.style.color = "#15803d";
    } else {
      input.setAttribute("readonly", true);
      btn.textContent = "✏️ Modificar";
      btn.style.background = "#fef3c7";
      btn.style.color = "#92400e";
      localStorage.setItem(`fixed_${inputId}`, input.value.trim());
    }
  }

  function loadFixedFieldValues() {
    fixedFields.forEach(id => {
      const saved = localStorage.getItem(`fixed_${id}`);
      const input = document.getElementById(id);
      if (saved) {
        input.value = saved;
        input.setAttribute("readonly", true);
      } else {
        input.removeAttribute("readonly");
      }
    });
  }

  function saveFixedFieldValues() {
    fixedFields.forEach(id => {
      localStorage.setItem(`fixed_${id}`, document.getElementById(id).value.trim());
    });
  }

  // Cámara optimizada
  function openScannerFor(targetInputId, fieldType) {
    activeScanTarget = targetInputId;
    activeScanType = fieldType;

    document.getElementById("scannerModalTitle").textContent = `Escaneando: ${fieldType}`;
    document.getElementById("scannerModal").style.display = "flex";

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = { fps: 8, qrbox: { width: 250, height: 150 }, aspectRatio: 1.777778 };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      () => {}
    ).catch(() => {
      alert("No se pudo iniciar la cámara.");
      closeScanner();
    });
  }

  function closeScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        document.getElementById("scannerModal").style.display = "none";
      }).catch(() => {
        document.getElementById("scannerModal").style.display = "none";
      });
    } else {
      document.getElementById("scannerModal").style.display = "none";
    }
  }

  function onScanSuccess(decodedText) {
    beepSuccess();
    if (navigator.vibrate) navigator.vibrate(80);

    const input = document.getElementById(activeScanTarget);
    if (input) {
      input.value = decodedText;
      closeScanner();
    }
  }

  // Envío a Google Sheets (Solo 1 llamada HTTP de ~800 bytes al terminar el formulario)
  function handleFormSubmit(e) {
    e.preventDefault();
    updateDateTime();
    saveFixedFieldValues();

    if (!scriptUrl) {
      alert("Configura la URL de Apps Script.");
      toggleConfig();
      return;
    }

    const btn = document.getElementById("btnSubmitForm");
    btn.disabled = true;
    btn.textContent = "⏳ Guardando en Sheets...";

    const formData = {
      fechaServicio: document.getElementById("fechaServicioInput").value,
      tecnico: document.getElementById("tecnicoInput").value.trim(),
      unidadAdmin: document.getElementById("unidadInput").value.trim(),
      piso: document.getElementById("pisoInput").value.trim(),
      inmueble: document.getElementById("inmuebleInput").value.trim(),
      usuario: document.getElementById("usuarioInput").value.trim(),
      marcaCpu: document.getElementById("marcaCpuInput").value.trim(),
      modeloCpu: document.getElementById("modeloCpuInput").value.trim(),
      serieCpu: document.getElementById("serieCpuInput").value.trim(),
      marcaMonitor: document.getElementById("marcaMonitorInput").value.trim(),
      modeloMonitor: document.getElementById("modeloMonitorInput").value.trim(),
      serieMonitor: document.getElementById("serieMonitorInput").value.trim(),
      marcaUps: document.getElementById("marcaUpsInput").value.trim(),
      modeloUps: document.getElementById("modeloUpsInput").value.trim(),
      serieUps: document.getElementById("serieUpsInput").value.trim(),
      estatus: document.getElementById("estatusInput").value
    };

    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "save", project: currentProject, formData: formData })
    })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "💾 Guardar Levantamiento en Sheets";

      if (res.status === "success") {
        beepSuccess();
        alert("✅ Levantamiento registrado");

        // Limpiar únicamente casillas de equipo
        ["marcaCpuInput", "modeloCpuInput", "serieCpuInput",
         "marcaMonitorInput", "modeloMonitorInput", "serieMonitorInput",
         "marcaUpsInput", "modeloUpsInput", "serieUpsInput"].forEach(id => document.getElementById(id).value = "");
      } else {
        alert("Error al guardar: " + res.message);
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "💾 Guardar Levantamiento en Sheets";
      alert("Error de conexión al enviar el registro.");
    });
  }

  // Opciones de catálogo bajo demanda
  function fetchCatOptions(manual) {
    if (!scriptUrl) return;

    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "get_options", project: currentProject })
    })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success" && data.options) {
        localStorage.setItem(`cat_${currentProject}`, JSON.stringify(data.options));
        populateDatalists(data.options);
        if (manual) alert("Catálogos actualizados.");
      }
    })
    .catch(() => {});
  }

  function loadLocalCatalogCache() {
    const raw = localStorage.getItem(`cat_${currentProject}`);
    if (raw) {
      try { populateDatalists(JSON.parse(raw)); } catch(e){}
    }
  }

  function populateDatalists(opts) {
    if (!opts) return;
    const fill = (id, list) => {
      if (!list) return;
      document.getElementById(id).innerHTML = list.map(item => `<option value="${escapeHtml(item)}"></option>`).join("");
    };
    fill("tecnicosList", opts.tecnicos);
    fill("unidadesList", opts.unidades);
    fill("inmueblesList", opts.inmuebles);
    fill("pisosList", opts.pisos);
    fill("marcasCpuList", opts.marcasCpu);
    fill("modelosCpuList", opts.modelosCpu);
    fill("marcasMonList", opts.marcasMon);
    fill("modelosMonList", opts.modelosMon);
    fill("marcasUpsList", opts.marcasUps);
    fill("modelosUpsList", opts.modelosUps);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
</script>

</body>
</html>
