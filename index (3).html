<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Levantamiento Técnico & Inventario</title>
  <!-- Librería de escaneo -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --locked-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 { font-size: 1.2rem; font-weight: 800; color: #1e293b; }
    h2 { font-size: 0.95rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      justify-content: space-between;
    }

    .req { color: var(--danger); font-weight: 800; }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--primary); }

    input:read-only {
      background-color: var(--locked-bg);
      color: #334155;
      font-weight: 600;
      border-style: dashed;
    }

    /* Botones */
    button {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-unlock { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; font-size: 0.75rem; padding: 4px 8px; }
    .btn-scan { background: #0284c7; color: white; padding: 9px 12px; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    
    .btn-submit {
      background: var(--success);
      color: white;
      font-size: 1.05rem;
      padding: 14px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .btn-submit:hover { background: #059669; }

    /* Modal / Escáner */
    .scanner-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }

    /* Banner Duplicado */
    .dup-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      display: none;
      animation: fadeIn 0.2s;
    }

    .collapsible { display: none; margin-top: 8px; }
    .collapsible.open { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section-divider {
      border-top: 1px solid var(--border);
      margin: 10px 0 12px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Configuración y Proyecto -->
  <div class="card">
    <div class="card-header">
      <h1>📋 Levantamiento Técnico</h1>
      <span class="badge" id="projectBadge">General</span>
    </div>

    <div style="display: flex; justify-content: space-between; gap: 8px;">
      <button class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="toggleConfig()">
        ⚙️ Configurar URL Script
      </button>
      <button class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="fetchAutoOptions()">
        🔄 Sincronizar Opciones
      </button>
    </div>

    <div id="configSection" class="collapsible">
      <div class="form-group" style="margin-top: 8px;">
        <label>URL Web App Google Apps Script</label>
        <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="btn-primary" style="margin-top: 6px;" onclick="saveScriptUrl()">Guardar URL</button>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="form-group">
      <label>Proyecto / Pestaña Activa</label>
      <div class="input-row">
        <input type="text" id="projectNameInput" placeholder="Ej: Piso_4_Oficinas">
        <button class="btn-primary" onclick="changeProject()">Fijar</button>
      </div>
    </div>
  </div>

  <!-- Formulario de Levantamiento -->
  <form id="inventoryForm" onsubmit="handleFormSubmit(event)">

    <!-- Datos Fijos / Persistentes -->
    <div class="card">
      <div class="card-header">
        <h2>📍 Datos de Ubicación y Personal</h2>
      </div>

      <!-- Técnico -->
      <div class="form-group">
        <label>Técnico <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="tecnicoInput" list="tecnicosList" required placeholder="Nombre del Técnico" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockTecnico" onclick="toggleFieldLock('tecnicoInput', 'btnUnlockTecnico')">✏️ Modificar</button>
        </div>
      </div>

      <!-- Unidad Administrativa -->
      <div class="form-group">
        <label>Unidad Administrativa <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="unidadInput" list="unidadesList" required placeholder="Área / Dirección" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockUnidad" onclick="toggleFieldLock('unidadInput', 'btnUnlockUnidad')">✏️ Modificar</button>
        </div>
      </div>

      <!-- Inmueble y Piso -->
      <div class="grid-2">
        <div class="form-group">
          <label>Inmueble <span class="req">*</span></label>
          <div class="input-row">
            <input type="text" id="inmuebleInput" list="inmueblesList" required placeholder="Edificio / Sede" readonly>
            <button type="button" class="btn-unlock" id="btnUnlockInmueble" onclick="toggleFieldLock('inmuebleInput', 'btnUnlockInmueble')">✏️</button>
          </div>
        </div>

        <div class="form-group">
          <label>Piso <span class="req">*</span></label>
          <div class="input-row">
            <input type="text" id="pisoInput" list="pisosList" required placeholder="Ej: Piso 3" readonly>
            <button type="button" class="btn-unlock" id="btnUnlockPiso" onclick="toggleFieldLock('pisoInput', 'btnUnlockPiso')">✏️</button>
          </div>
        </div>
      </div>

      <!-- Usuario -->
      <div class="form-group">
        <label>Usuario Asignado <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="usuarioInput" required placeholder="Nombre completo del usuario" readonly>
          <button type="button" class="btn-unlock" id="btnUnlockUsuario" onclick="toggleFieldLock('usuarioInput', 'btnUnlockUsuario')">✏️ Modificar</button>
        </div>
      </div>

      <!-- Fecha del Servicio -->
      <div class="form-group">
        <label>Fecha del Servicio</label>
        <input type="text" id="fechaServicioInput" readonly>
      </div>
    </div>

    <!-- Equipo 1: CPU -->
    <div class="card">
      <h2>🖥️ CPU / Computadora</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca CPU</label>
          <input type="text" id="marcaCpuInput" list="marcasCpuList" placeholder="Ej: Dell">
        </div>
        <div class="form-group">
          <label>Modelo CPU</label>
          <input type="text" id="modeloCpuInput" list="modelosCpuList" placeholder="Ej: OptiPlex 7080">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie CPU <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieCpuInput" required placeholder="Escanear o escribir..." onblur="checkDuplicateOnBlur(this, 'CPU')">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieCpuInput', 'CPU')">📷 Escanear</button>
        </div>
        <div id="dup-serieCpuInput" class="dup-banner"></div>
      </div>
    </div>

    <!-- Equipo 2: Monitor -->
    <div class="card">
      <h2>🖥️ Monitor</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca Monitor</label>
          <input type="text" id="marcaMonitorInput" list="marcasMonList" placeholder="Ej: HP">
        </div>
        <div class="form-group">
          <label>Modelo Monitor</label>
          <input type="text" id="modeloMonitorInput" list="modelosMonList" placeholder="Ej: P24v G4">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie Monitor <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieMonitorInput" required placeholder="Escanear o escribir..." onblur="checkDuplicateOnBlur(this, 'Monitor')">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieMonitorInput', 'Monitor')">📷 Escanear</button>
        </div>
        <div id="dup-serieMonitorInput" class="dup-banner"></div>
      </div>
    </div>

    <!-- Equipo 3: No Break / UPS -->
    <div class="card">
      <h2>🔋 No Break / UPS</h2>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="form-group">
          <label>Marca No Break</label>
          <input type="text" id="marcaUpsInput" list="marcasUpsList" placeholder="Ej: APC">
        </div>
        <div class="form-group">
          <label>Modelo No Break</label>
          <input type="text" id="modeloUpsInput" list="modelosUpsList" placeholder="Ej: Back-UPS 600">
        </div>
      </div>
      <div class="form-group">
        <label>No. de Serie No Break <span class="req">*</span></label>
        <div class="input-row">
          <input type="text" id="serieUpsInput" required placeholder="Escanear o escribir..." onblur="checkDuplicateOnBlur(this, 'UPS')">
          <button type="button" class="btn-scan" onclick="openScannerFor('serieUpsInput', 'UPS')">📷 Escanear</button>
        </div>
        <div id="dup-serieUpsInput" class="dup-banner"></div>
      </div>
    </div>

    <!-- Estatus y Envío -->
    <div class="card">
      <div class="form-group">
        <label>Estatus del Servicio</label>
        <select id="estatusInput">
          <option value="En Proceso">En Proceso</option>
          <option value="Cerrado">Cerrado</option>
          <option value="Pendiente">Pendiente</option>
        </select>
      </div>

      <button type="submit" id="btnSubmitForm" class="btn-submit">
        💾 Guardar Levantamiento en Sheets
      </button>
    </div>

  </form>

</div>

<!-- Modal Escáner de Cámara -->
<div id="scannerModal" class="scanner-modal" style="display: none;">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="scannerModalTitle" style="font-size: 1rem; color: #1e293b;">Escaneando...</h3>
      <button type="button" class="btn-danger" style="padding: 4px 8px;" onclick="closeScanner()">✖ Cerrar</button>
    </div>
    
    <div id="reader"></div>

    <div style="font-size: 0.78rem; color: var(--muted); text-align: center;">
      Apunta al código de barras del equipo.
    </div>
  </div>
</div>

<!-- Datalists para Autocompletado Inteligente -->
<datalist id="tecnicosList"></datalist>
<datalist id="unidadesList"></datalist>
<datalist id="inmueblesList"></datalist>
<datalist id="pisosList"></datalist>
<datalist id="marcasCpuList"></datalist>
<datalist id="modelosCpuList"></datalist>
<datalist id="marcasMonList"></datalist>
<datalist id="modelosMonList"></datalist>
<datalist id="marcasUpsList"></datalist>
<datalist id="modelosUpsList"></datalist>

<!-- Sonidos -->
<audio id="beepSuccess" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
<audio id="beepAlert" src="https://assets.mixkit.co/active_storage/sfx/2873/2873-preview.mp3" preload="auto"></audio>

<script>
  let html5QrCode = null;
  let activeScanTarget = null;
  let activeScanType = "";

  // Estado y configuraciones
  let currentProject = localStorage.getItem("inv_current_project") || "General";
  let scriptUrl = localStorage.getItem("scanner_script_url") || "";

  // Campos fijos persistentes
  const fixedFields = ["tecnicoInput", "unidadInput", "inmuebleInput", "pisoInput", "usuarioInput"];

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("projectNameInput").value = currentProject;
    document.getElementById("projectBadge").textContent = currentProject;
    document.getElementById("scriptUrlInput").value = scriptUrl;

    updateDateTime();
    loadFixedFieldValues();
    loadDatalistCache();
    if (scriptUrl) fetchAutoOptions();
  });

  function updateDateTime() {
    const pad = n => String(n).padStart(2, '0');
    const d = new Date();
    const formatted = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById("fechaServicioInput").value = formatted;
  }

  function toggleConfig() {
    document.getElementById("configSection").classList.toggle("open");
  }

  function saveScriptUrl() {
    const val = document.getElementById("scriptUrlInput").value.trim();
    scriptUrl = val;
    localStorage.setItem("scanner_script_url", scriptUrl);
    alert("URL guardada.");
    toggleConfig();
    fetchAutoOptions();
  }

  function changeProject() {
    const val = document.getElementById("projectNameInput").value.trim();
    if (!val) return;
    currentProject = val;
    localStorage.setItem("inv_current_project", currentProject);
    document.getElementById("projectBadge").textContent = currentProject;
    fetchAutoOptions();
    alert(`Proyecto activo cambiado a: ${currentProject}`);
  }

  // Manejo de Bloqueo/Desbloqueo de campos fijos
  function toggleFieldLock(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);

    if (input.hasAttribute("readonly")) {
      input.removeAttribute("readonly");
      input.focus();
      btn.textContent = "🔒 Fijar";
      btn.style.background = "#dcfce7";
      btn.style.color = "#15803d";
    } else {
      input.setAttribute("readonly", true);
      btn.textContent = "✏️ Modificar";
      btn.style.background = "#fef3c7";
      btn.style.color = "#92400e";
      // Guardar en memoria local
      localStorage.setItem(`fixed_${inputId}`, input.value.trim());
    }
  }

  function loadFixedFieldValues() {
    fixedFields.forEach(id => {
      const saved = localStorage.getItem(`fixed_${id}`);
      const input = document.getElementById(id);
      if (saved) {
        input.value = saved;
        input.setAttribute("readonly", true);
      } else {
        input.removeAttribute("readonly");
      }
    });
  }

  function saveFixedFieldValues() {
    fixedFields.forEach(id => {
      const val = document.getElementById(id).value.trim();
      localStorage.setItem(`fixed_${id}`, val);
    });
  }

  // Escáner de Cámara para Campos Específicos
  function openScannerFor(targetInputId, fieldType) {
    activeScanTarget = targetInputId;
    activeScanType = fieldType;

    document.getElementById("scannerModalTitle").textContent = `Escaneando: ${fieldType}`;
    document.getElementById("scannerModal").style.display = "flex";

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = { fps: 10, qrbox: { width: 260, height: 160 }, aspectRatio: 1.777778 };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      () => {}
    ).catch(err => {
      console.error("Error al iniciar cámara:", err);
      alert("No se pudo iniciar la cámara.");
      closeScanner();
    });
  }

  function closeScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        document.getElementById("scannerModal").style.display = "none";
      }).catch(() => {
        document.getElementById("scannerModal").style.display = "none";
      });
    } else {
      document.getElementById("scannerModal").style.display = "none";
    }
  }

  function onScanSuccess(decodedText) {
    playAudio("beepSuccess");
    if (navigator.vibrate) navigator.vibrate(100);

    const input = document.getElementById(activeScanTarget);
    if (input) {
      input.value = decodedText;
      closeScanner();
      checkDuplicateOnBlur(input, activeScanType);
    }
  }

  // Verificación de Duplicados en tiempo real
  function checkDuplicateOnBlur(inputElem, fieldType) {
    const val = inputElem.value.trim();
    const banner = document.getElementById(`dup-${inputElem.id}`);
    if (!val) {
      if (banner) banner.style.display = "none";
      return;
    }

    if (!scriptUrl) return;

    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "check_duplicate",
        project: currentProject,
        serial: val,
        fieldType: fieldType
      })
    })
    .then(r => r.json())
    .then(res => {
      if (res.isDuplicate && res.duplicateInfo) {
        playAudio("beepAlert");
        if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
        const info = res.duplicateInfo;
        banner.innerHTML = `⚠️ <b>¡Serie ya registrada en esta hoja!</b><br>📍 Celda: ${info.cell} | 🕒 Fecha: ${info.date} (${info.device})`;
        banner.style.display = "block";
      } else {
        if (banner) banner.style.display = "none";
      }
    })
    .catch(() => {});
  }

  // Envío del Formulario Completo a Google Sheets
  function handleFormSubmit(e) {
    e.preventDefault();
    updateDateTime();
    saveFixedFieldValues();

    if (!scriptUrl) {
      alert("Por favor configura la URL del Web App de Google Apps Script.");
      toggleConfig();
      return;
    }

    const btn = document.getElementById("btnSubmitForm");
    btn.disabled = true;
    btn.textContent = "⏳ Guardando en Sheets...";

    const formData = {
      fechaServicio: document.getElementById("fechaServicioInput").value,
      tecnico: document.getElementById("tecnicoInput").value.trim(),
      unidadAdmin: document.getElementById("unidadInput").value.trim(),
      piso: document.getElementById("pisoInput").value.trim(),
      inmueble: document.getElementById("inmuebleInput").value.trim(),
      usuario: document.getElementById("usuarioInput").value.trim(),
      marcaCpu: document.getElementById("marcaCpuInput").value.trim(),
      modeloCpu: document.getElementById("modeloCpuInput").value.trim(),
      serieCpu: document.getElementById("serieCpuInput").value.trim(),
      marcaMonitor: document.getElementById("marcaMonitorInput").value.trim(),
      modeloMonitor: document.getElementById("modeloMonitorInput").value.trim(),
      serieMonitor: document.getElementById("serieMonitorInput").value.trim(),
      marcaUps: document.getElementById("marcaUpsInput").value.trim(),
      modeloUps: document.getElementById("modeloUpsInput").value.trim(),
      serieUps: document.getElementById("serieUpsInput").value.trim(),
      estatus: document.getElementById("estatusInput").value
    };

    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "save",
        project: currentProject,
        formData: formData
      })
    })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = "💾 Guardar Levantamiento en Sheets";

      if (res.status === "success") {
        playAudio("beepSuccess");
        alert("✅ ¡Levantamiento registrado exitosamente!");
        
        // Limpiar campos variables (marcas, modelos y series)
        const toClear = [
          "marcaCpuInput", "modeloCpuInput", "serieCpuInput",
          "marcaMonitorInput", "modeloMonitorInput", "serieMonitorInput",
          "marcaUpsInput", "modeloUpsInput", "serieUpsInput"
        ];
        toClear.forEach(id => document.getElementById(id).value = "");
        document.querySelectorAll(".dup-banner").forEach(b => b.style.display = "none");

        // Actualizar autocompletados
        fetchAutoOptions();
      } else {
        alert("Error al guardar: " + res.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = "💾 Guardar Levantamiento en Sheets";
      alert("Error de conexión al enviar el registro.");
    });
  }

  // Carga de opciones previas para autollenado (Datalists)
  function fetchAutoOptions() {
    if (!scriptUrl) return;

    fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "get_options", project: currentProject })
    })
    .then(r => r.json())
    .then(data => {
      if (data.status === "success" && data.options) {
        localStorage.setItem(`cache_options_${currentProject}`, JSON.stringify(data.options));
        populateDatalists(data.options);
      }
    })
    .catch(() => {});
  }

  function loadDatalistCache() {
    const raw = localStorage.getItem(`cache_options_${currentProject}`);
    if (raw) {
      try { populateDatalists(JSON.parse(raw)); } catch(e){}
    }
  }

  function populateDatalists(opts) {
    fillDatalist("tecnicosList", opts.tecnicos);
    fillDatalist("unidadesList", opts.unidades);
    fillDatalist("inmueblesList", opts.inmuebles);
    fillDatalist("pisosList", opts.pisos);
    fillDatalist("marcasCpuList", opts.marcasCpu);
    fillDatalist("modelosCpuList", opts.modelosCpu);
    fillDatalist("marcasMonList", opts.marcasMon);
    fillDatalist("modelosMonList", opts.modelosMon);
    fillDatalist("marcasUpsList", opts.marcasUps);
    fillDatalist("modelosUpsList", opts.modelosUps);
  }

  function fillDatalist(id, list) {
    if (!list) return;
    const dl = document.getElementById(id);
    dl.innerHTML = list.map(item => `<option value="${escapeHtml(item)}"></option>`).join("");
  }

  function playAudio(id) {
    const snd = document.getElementById(id);
    if (snd) { snd.currentTime = 0; snd.play().catch(() => {}); }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
</script>

</body>
</html>
